<script>
  new QRCode(document.getElementById("qrcode"), {
    text: "https://ghanabuys.org",
    width: 280,
    height: 280,
    colorDark: "#00693E",
    colorLight: "#FAF6EA",
    correctLevel: QRCode.CorrectLevel.H
  });

  function buildFinalImage(callback) {
    setTimeout(function () {
      const qrCanvas = document.querySelector('#qrcode canvas');
      const out = document.createElement('canvas');
      out.width = 320; out.height = 360;
      const ctx = out.getContext('2d');
      ctx.fillStyle = '#FAF6EA';
      ctx.fillRect(0, 0, out.width, out.height);
      ctx.drawImage(qrCanvas, 20, 20, 280, 280);

      // logo backing (simple square, avoids roundRect for older browser support)
      const cx = out.width / 2, cy = 20 + 140;
      ctx.fillStyle = '#FAF6EA';
      ctx.fillRect(cx - 35, cy - 35, 70, 70);

      const logoImg = document.getElementById('logoSrc');
      if (logoImg.complete && logoImg.naturalWidth > 0) {
        ctx.drawImage(logoImg, cx - 30, cy - 30, 60, 60);
      }

      ctx.fillStyle = '#17130E';
      ctx.font = 'bold 18px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('ghanabuys.org', out.width / 2, 345);

      callback(out.toDataURL('image/png'));
    }, 150);
  }

  buildFinalImage(function (dataUrl) {
    document.getElementById('finalImg').src = dataUrl;
  });

  document.getElementById('downloadBtn').addEventListener('click', function () {
    const img = document.getElementById('finalImg');
    if (!img.src) return;
    const link = document.createElement('a');
    link.download = 'ghanabuys-qr-code.png';
    link.href = img.src;
    link.click();
  });
</script>
