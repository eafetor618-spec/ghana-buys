<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store — Ghana Buys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Archivo:wght@700;800;900&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#00693E">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ghana Buys">
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="page-store">

<nav>
  <a class="brand" href="/"><img class="logo-mark" src="/logo-icon.png" alt="Ghana Buys">Ghana Buys</a>
  <div class="nav-actions">
    <a class="back" href="/marketplace">&larr; All listings</a>
    <a class="nav-sell" href="/post">+ Sell</a>
    <a class="nav-account" href="/account" id="navAccountLink">Log in</a>
  </div>
</nav>
<div class="kente-bar"></div>

<article class="wrap" id="storeArticle">
  <div class="empty-state"><h3>Loading store…</h3></div>
</article>

<div class="kente-bar"></div>
<footer>
  <div class="footer-inner">
    <span>&copy; 2026 Ghana Buys</span>
    <span>Ghana's marketplace — buy, sell, connect</span>
    <a href="/marketplace" style="color:var(--ink-soft);">Marketplace</a>
    <a href="/privacy" style="color:var(--ink-soft);">Privacy Policy</a>
  </div>
</footer>

<script src="/marketplace.js"></script>
<script>
  const storeId = new URLSearchParams(location.search).get('id');
  const article = document.getElementById('storeArticle');

  async function loadStore() {
    if (!storeId) {
      article.innerHTML = '<div class="empty-state"><h3>Store not found</h3></div>';
      return;
    }

    const { data: store, error } = await sb.from('stores').select('*').eq('id', storeId).maybeSingle();

    if (error || !store) {
      article.innerHTML = '<div class="empty-state"><h3>Store not found</h3><p>This store may have been removed.</p></div>';
      return;
    }

    const isActive = store.active && store.expires_at && new Date(store.expires_at) > new Date();
    const badge = isActive ? '<span class="listing-featured-badge" style="position:static;display:inline-block;margin-bottom:10px;">✓ Verified Store</span>' : '';

    article.innerHTML =
      '<nav class="breadcrumb" aria-label="Breadcrumb"><a href="/">Home</a><span class="crumb-sep">/</span><a href="/marketplace">Marketplace</a><span class="crumb-sep">/</span><span aria-current="page">' + escapeHtml(store.name) + '</span></nav>' +
      badge +
      '<h1 class="title">' + escapeHtml(store.name) + '</h1>' +
      '<div id="storeRatingSummary" style="margin:4px 0 12px; font-size:0.9rem; color:var(--ink-soft);"></div>' +
      (store.description ? '<p class="lead">' + escapeHtml(store.description) + '</p>' : '') +
      (store.whatsapp ? '<a class="cta" href="' + whatsappLink(store.whatsapp, 'Hi! I saw your store on Ghana Buys.') + '" target="_blank" rel="noopener">Message on WhatsApp →</a>' : '') +
      '<h2 class="section-h" style="margin-top:36px;">Listings from this store</h2>' +
      '<div class="listing-grid" id="storeListings" style="margin-top:16px;"><div class="empty-state" style="grid-column:1/-1;"><h3>Loading…</h3></div></div>' +
      '<h2 class="section-h" style="margin-top:36px;">Reviews</h2>' +
      '<div id="storeReviews" style="margin-top:16px;"><p style="color:var(--ink-soft);">Loading reviews…</p></div>' +
      '<div id="leaveReviewBox"></div>';

    if (!isActive) {
      const notice = document.createElement('div');
      notice.className = 'callout';
      notice.style.marginTop = '16px';
      notice.innerHTML = '<strong>Note:</strong> This store\'s subscription isn\'t currently active.';
      article.insertBefore(notice, article.querySelector('h2.section-h'));
    }

    const { data: listings } = await sb
      .from('listings')
      .select('*')
      .eq('user_id', store.user_id)
      .eq('status', 'active')
      .order('featured', { ascending: false })
      .order('created_at', { ascending: false });

    const grid = document.getElementById('storeListings');
    if (!listings || !listings.length) {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><h3>No active listings right now</h3></div>';
      loadStoreReviews(store.user_id);
      return;
    }
    grid.innerHTML = listings.map(listingCardHTML).join('');
    refreshSavedButtons();
    loadStoreReviews(store.user_id);
  }

  function starString(rating) {
    return '★★★★★'.slice(0, rating) + '☆☆☆☆☆'.slice(0, 5 - rating);
  }

  async function loadStoreReviews(sellerId) {
    const wrap = document.getElementById('storeReviews');
    const summary = document.getElementById('storeRatingSummary');

    const { data: reviews, error } = await sb
      .from('reviews')
      .select('rating, comment, created_at')
      .eq('seller_id', sellerId)
      .order('created_at', { ascending: false });

    if (error) {
      wrap.innerHTML = '<p style="color:var(--ink-soft);">Couldn\'t load reviews right now.</p>';
      return;
    }

    if (!reviews || !reviews.length) {
      summary.textContent = 'No reviews yet';
      wrap.innerHTML = '<p style="color:var(--ink-soft);">This seller hasn\'t been reviewed yet.</p>';
    } else {
      const avg = reviews.reduce(function (sum, r) { return sum + r.rating; }, 0) / reviews.length;
      const rounded = Math.round(avg);
      summary.innerHTML = '<span style="color:var(--gold); letter-spacing:1px;">' + starString(rounded) + '</span> ' +
        avg.toFixed(1) + ' out of 5 &middot; ' + reviews.length + ' review' + (reviews.length === 1 ? '' : 's');

      wrap.innerHTML = reviews.map(function (r) {
        const when = new Date(r.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        return (
          '<div style="padding:12px 0; border-bottom:1.5px solid var(--line);">' +
            '<span style="color:var(--gold); letter-spacing:1px;">' + starString(r.rating) + '</span> ' +
            '<span style="font-size:0.8rem; color:var(--ink-soft);">' + when + '</span>' +
            (r.comment ? '<p style="margin:6px 0 0; font-size:0.9rem;">' + escapeHtml(r.comment) + '</p>' : '') +
          '</div>'
        );
      }).join('');
    }

    showLeaveReviewBox(sellerId);
  }

  async function showLeaveReviewBox(sellerId) {
    const box = document.getElementById('leaveReviewBox');
    if (!box) return;

    const { data: { session } } = await sb.auth.getSession();
    if (session && session.user.id === sellerId) return; // owners can't review themselves

    const { data: existing } = session
      ? await sb.from('reviews').select('rating, comment').eq('seller_id', sellerId).eq('reviewer_id', session.user.id).is('listing_id', null).maybeSingle()
      : { data: null };

    if (existing) {
      box.innerHTML =
        '<div class="callout" style="margin-top:16px;"><strong>You rated this seller</strong> ' +
          '<span style="color:var(--gold); letter-spacing:1px;">' + starString(existing.rating) + '</span>' +
          (existing.comment ? '<p style="margin-top:6px; font-size:0.9rem;">' + escapeHtml(existing.comment) + '</p>' : '') +
        '</div>';
      return;
    }

    box.innerHTML =
      '<button type="button" class="btn-secondary" id="leaveReviewToggle" style="margin-top:16px;">⭐ Leave a review</button>' +
      '<div id="leaveReviewForm" style="display:none; margin-top:10px;">' +
        '<div class="star-input" style="display:flex; gap:4px; font-size:1.6rem; margin:8px 0;">' +
          [1, 2, 3, 4, 5].map(function (n) {
            return '<button type="button" class="star-btn" data-value="' + n + '" style="background:none; border:none; padding:0; cursor:pointer; color:var(--line); line-height:1;">★</button>';
          }).join('') +
        '</div>' +
        '<textarea id="leaveReviewComment" rows="2" placeholder="How was your experience with this seller? (optional)"></textarea>' +
        '<button type="button" class="btn-primary" id="leaveReviewSubmitBtn" style="width:100%; justify-content:center; margin-top:8px;">Submit rating</button>' +
        '<div class="form-status" id="leaveReviewStatus"></div>' +
      '</div>';

    let selectedRating = 0;
    const stars = box.querySelectorAll('.star-btn');
    stars.forEach(function (s) {
      s.addEventListener('click', function () {
        selectedRating = Number(s.dataset.value);
        stars.forEach(function (b) { b.style.color = Number(b.dataset.value) <= selectedRating ? 'var(--gold)' : 'var(--line)'; });
      });
    });

    document.getElementById('leaveReviewToggle').addEventListener('click', async function () {
      const { data: { session: s } } = await sb.auth.getSession();
      if (!s) {
        window.location.href = '/account?next=' + encodeURIComponent(location.pathname + location.search);
        return;
      }
      const form = document.getElementById('leaveReviewForm');
      form.style.display = form.style.display === 'none' ? 'block' : 'none';
    });

    document.getElementById('leaveReviewSubmitBtn').addEventListener('click', async function () {
      const statusEl = document.getElementById('leaveReviewStatus');
      if (!selectedRating) {
        statusEl.textContent = 'Please choose a star rating.';
        statusEl.className = 'form-status error';
        return;
      }
      const btn = this;
      btn.disabled = true; btn.textContent = 'Submitting…';
      try {
        await submitReview(sellerId, null, selectedRating, document.getElementById('leaveReviewComment').value);
        loadStoreReviews(sellerId);
      } catch (err) {
        statusEl.textContent = err.message || 'Could not submit rating.';
        statusEl.className = 'form-status error';
        btn.disabled = false; btn.textContent = 'Submit rating';
      }
    });
  }

  loadStore();
</script>

</body>
</html>
