<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Listing — Ghana Buys Marketplace</title>
<meta name="description" id="pageDesc" content="View this listing on Ghana Buys marketplace and connect with the seller on WhatsApp.">
<link rel="canonical" href="https://ghanabuys.com/listing">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Archivo:wght@700;800;900&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://js.paystack.co/v1/inline.js"></script>
</head>
<body class="page-listing">

<nav>
  <a class="brand" href="/"><img class="logo-mark" src="/logo-icon.png" alt="Ghana Buys">Ghana Buys</a>
  <a class="back" href="/marketplace">&larr; All listings</a>
</nav>
<div class="kente-bar"></div>

<article class="wrap">
  <nav class="breadcrumb" aria-label="Breadcrumb"><a href="/">Home</a><span class="crumb-sep">/</span><a href="/marketplace">Marketplace</a><span class="crumb-sep">/</span><span aria-current="page">Listing</span></nav>

  <div id="listingContent">
    <div class="empty-state"><h3>Loading listing…</h3></div>
  </div>
</article>

<div class="kente-bar"></div>
<footer>
  <div class="footer-inner">
    <span>&copy; 2026 Ghana Buys</span>
    <span>Ghana's marketplace — buy, sell, connect</span>
    <a href="/post" style="color:var(--ink-soft);">Post an Item</a>
    <a href="/privacy" style="color:var(--ink-soft);">Privacy Policy</a>
  </div>
</footer>

<script src="/marketplace.js"></script>
<script>

  const content = document.getElementById('listingContent');
  const listingId = new URLSearchParams(location.search).get('id');

  function renderNotFound() {
    content.innerHTML =
      '<div class="empty-state">' +
        '<h3>Listing not found</h3>' +
        '<p>It may have been removed, or the link is incorrect.</p>' +
        '<a class="btn-outline" href="/marketplace">Browse other listings</a>' +
      '</div>';
  }

  async function loadListing() {
    if (!listingId) { renderNotFound(); return; }

    try {
      const { data, error } = await sb.from('listings').select('*').eq('id', listingId).maybeSingle();
      if (error || !data) { renderNotFound(); return; }

      document.getElementById('pageTitle').textContent = data.title + ' — Ghana Buys Marketplace';
      document.getElementById('pageDesc').setAttribute('content', (data.description || data.title).slice(0, 155));

      const img = data.image_url
        ? '<img src="' + escapeHtml(data.image_url) + '" alt="' + escapeHtml(data.title) + '">'
        : placeholderIconSVG();

      const soldNote = data.status === 'sold'
        ? '<div class="callout" style="margin-bottom:20px;"><strong>This item has been marked sold.</strong> The seller may still respond, but it may no longer be available.</div>'
        : '';

      if (data.status === 'under_review') {
        content.innerHTML =
          '<div class="callout"><strong>This listing is under review.</strong> ' +
          'It received multiple reports and has been temporarily hidden while we take a look. ' +
          'If this is your listing and you believe this was a mistake, contact us.</div>';
        return;
      }

      const isFeatured = data.featured && data.featured_until && new Date(data.featured_until) > new Date();
      const featuredNote = isFeatured
        ? '<span class="listing-featured-badge" style="margin-bottom:12px;display:inline-block;">★ Featured until ' +
          new Date(data.featured_until).toLocaleDateString('en-GH', { day: 'numeric', month: 'short' }) + '</span>'
        : '';

      const waMsg = 'Hi! I saw "' + data.title + '" on Ghana Buys and I\'m interested.';

      content.innerHTML =
        soldNote +
        '<div class="listing-detail">' +
          '<div class="listing-detail-img">' + img + '</div>' +
          '<div>' +
            featuredNote +
            '<h1>' + escapeHtml(data.title) + '</h1>' +
            '<span class="price-big">' + formatPrice(data.price) + '</span>' +
            '<div class="listing-info-row">' +
              '<span>' + escapeHtml(data.category) + '</span>' +
              (data.location ? '<span>📍 ' + escapeHtml(data.location) + '</span>' : '') +
              '<span>Posted ' + formatDate(data.created_at) + '</span>' +
            '</div>' +
            (data.description ? '<p class="desc">' + escapeHtml(data.description) + '</p>' : '') +
            '<a class="whatsapp-btn" href="' + whatsappLink(data.whatsapp, waMsg) + '" target="_blank" rel="noopener">' +
              '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2zm0 18.1h-.01a8.2 8.2 0 0 1-4.18-1.14l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.35c0-4.53 3.7-8.22 8.24-8.22 2.2 0 4.27.86 5.82 2.42a8.17 8.17 0 0 1 2.41 5.81c0 4.53-3.7 8.19-8.23 8.19zm4.52-6.16c-.25-.12-1.47-.72-1.7-.81-.23-.08-.39-.12-.56.13-.17.25-.64.81-.78.97-.15.17-.29.19-.54.06-.25-.12-1.04-.38-1.98-1.22-.73-.65-1.23-1.46-1.37-1.7-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.15.16-.25.25-.42.08-.16.04-.31-.02-.43-.06-.12-.56-1.36-.77-1.86-.2-.49-.41-.42-.56-.43-.14-.01-.31-.01-.48-.01a.92.92 0 0 0-.67.31c-.23.25-.87.85-.87 2.08 0 1.23.89 2.41 1.02 2.58.12.16 1.75 2.68 4.25 3.75.59.26 1.06.41 1.42.52.6.19 1.14.16 1.57.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.16-.47-.28z"></path></svg>' +
              'Chat on WhatsApp' +
            '</a>' +
            '<div class="seller-box"><strong>' + escapeHtml(data.seller_name) + '</strong>Posted this listing directly. Ghana Buys doesn\'t verify sellers or handle payment — meet safely and inspect items before you pay.</div>' +
            '<div id="featureBox"></div>' +
            '<button type="button" id="reportLink" class="report-link">⚑ Report this listing</button>' +
          '</div>' +
        '</div>' +
        '<div id="reportModalWrap"></div>';

      document.getElementById('reportLink').addEventListener('click', function () {
        openReportModal(data.id);
      });

      showFeatureBoxIfOwner(data);
    } catch (err) {
      renderNotFound();
    }
  }

  // Only the listing's own seller sees the "feature this" option, and only
  // if it isn't already actively featured.
  async function showFeatureBoxIfOwner(listing) {
    const box = document.getElementById('featureBox');
    if (!box) return;
    const { data: { session } } = await sb.auth.getSession();
    if (!session || !session.user || session.user.id !== listing.user_id) return;

    const isFeatured = listing.featured && listing.featured_until && new Date(listing.featured_until) > new Date();
    if (isFeatured) return;

    box.innerHTML =
      '<div class="callout" style="margin-top:16px;">' +
        '<strong>Get more views</strong>' +
        '<p style="margin:6px 0 12px;">Feature this listing at the top of the marketplace for 7 days — ₵10, pay by card or Mobile Money.</p>' +
        '<button class="btn-primary" id="featureBtn" type="button">Feature this listing — ₵10</button>' +
        '<div class="form-status" id="featureStatus"></div>' +
      '</div>';

    document.getElementById('featureBtn').addEventListener('click', function () {
      const btn = this;
      const statusEl = document.getElementById('featureStatus');
      btn.disabled = true;
      btn.textContent = 'Opening payment…';
      statusEl.textContent = '';
      statusEl.className = 'form-status';

      startFeatureListingCheckout(
        listing.id,
        function () {
          statusEl.textContent = 'Payment confirmed — your listing is now featured!';
          statusEl.className = 'form-status success';
          setTimeout(function () { location.reload(); }, 1500);
        },
        function (err) {
          statusEl.textContent = 'Something went wrong: ' + (err.message || 'please try again.');
          statusEl.className = 'form-status error';
          btn.disabled = false;
          btn.textContent = 'Feature this listing — ₵10';
        }
      );
    });
  }

  function openReportModal(listingId) {
    const wrap = document.getElementById('reportModalWrap');
    wrap.innerHTML =
      '<div class="modal-backdrop" id="reportBackdrop">' +
        '<div class="modal-box">' +
          '<h3>Report this listing</h3>' +
          '<p style="color:var(--ink-soft);font-size:0.9rem;margin-bottom:14px;">' +
            'Let us know what\'s wrong. If a listing gets several reports it\'s automatically hidden while we review it.' +
          '</p>' +
          '<label class="report-reason"><input type="radio" name="reportReason" value="scam"> Scam or suspicious</label>' +
          '<label class="report-reason"><input type="radio" name="reportReason" value="sold_elsewhere"> Already sold elsewhere</label>' +
          '<label class="report-reason"><input type="radio" name="reportReason" value="wrong_category"> Wrong category</label>' +
          '<label class="report-reason"><input type="radio" name="reportReason" value="offensive"> Offensive content</label>' +
          '<label class="report-reason"><input type="radio" name="reportReason" value="other"> Something else</label>' +
          '<textarea id="reportDetails" placeholder="Any extra details (optional)" rows="3"></textarea>' +
          '<div class="form-status" id="reportStatus"></div>' +
          '<div class="modal-actions">' +
            '<button type="button" class="btn-secondary" id="reportCancel">Cancel</button>' +
            '<button type="button" class="btn-primary" id="reportSubmit">Submit report</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    document.getElementById('reportBackdrop').addEventListener('click', function (e) {
      if (e.target === this) wrap.innerHTML = '';
    });
    document.getElementById('reportCancel').addEventListener('click', function () { wrap.innerHTML = ''; });

    document.getElementById('reportSubmit').addEventListener('click', async function () {
      const statusEl = document.getElementById('reportStatus');
      const selected = document.querySelector('input[name="reportReason"]:checked');
      if (!selected) {
        statusEl.textContent = 'Please choose a reason.';
        statusEl.className = 'form-status error';
        return;
      }
      const btn = this;
      btn.disabled = true;
      btn.textContent = 'Submitting…';

      const { data: { session } } = await sb.auth.getSession();

      const { error } = await sb.from('listing_reports').insert({
        listing_id: listingId,
        reason: selected.value,
        details: document.getElementById('reportDetails').value.slice(0, 500) || null,
        reporter_user_id: session && session.user ? session.user.id : null
      });

      if (error) {
        statusEl.textContent = 'Something went wrong: ' + error.message;
        statusEl.className = 'form-status error';
        btn.disabled = false;
        btn.textContent = 'Submit report';
        return;
      }

      wrap.innerHTML = '<div class="modal-backdrop"><div class="modal-box">' +
        '<h3>Thanks — report received</h3>' +
        '<p style="color:var(--ink-soft);font-size:0.9rem;">We\'ll take a look. This helps keep Ghana Buys safe for everyone.</p>' +
        '<div class="modal-actions"><button type="button" class="btn-primary" id="reportDone">Close</button></div>' +
      '</div></div>';
      document.getElementById('reportDone').addEventListener('click', function () { wrap.innerHTML = ''; });
    });
  }

  loadListing();

</script>

</body>
</html>
