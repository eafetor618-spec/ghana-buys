<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Ghana Buys Marketplace</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Archivo:wght@700;800;900&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="page-account">

<nav>
  <a class="brand" href="/"><img class="logo-mark" src="/logo-icon.png" alt="Ghana Buys">Ghana Buys</a>
  <a class="back" href="/marketplace">&larr; All listings</a>
</nav>
<div class="kente-bar"></div>

<article class="wrap">
  <span class="tag">Admin</span>
  <h1 class="title">Moderation</h1>
  <p class="lead">Listings flagged by reports, hidden pending your review.</p>

  <div id="adminGate"></div>
  <div id="adminContent" style="display:none;">
    <div class="admin-tabs">
      <button type="button" class="auth-tab active" id="tabOverview">Overview</button>
      <button type="button" class="auth-tab" id="tabUnderReview">Under review</button>
      <button type="button" class="auth-tab" id="tabAllReports">All reports</button>
      <button type="button" class="auth-tab" id="tabIdVerifications">ID verifications <span id="idVerifyBadge" class="sales-badge" style="display:none; background:var(--red); color:#fff; font-size:0.7rem; padding:2px 6px; border-radius:10px; margin-left:4px;"></span></button>
      <button type="button" class="auth-tab" id="tabFeatureRequests">Feature requests <span id="featureReqBadge" class="sales-badge" style="display:none; background:var(--red); color:#fff; font-size:0.7rem; padding:2px 6px; border-radius:10px; margin-left:4px;"></span></button>
      <button type="button" class="auth-tab" id="tabStoreRequests">Store subscriptions <span id="storeReqBadge" class="sales-badge" style="display:none; background:var(--red); color:#fff; font-size:0.7rem; padding:2px 6px; border-radius:10px; margin-left:4px;"></span></button>
      <button type="button" class="auth-tab" id="tabListingPosts">New listings <span id="listingPostBadge" class="sales-badge" style="display:none; background:var(--red); color:#fff; font-size:0.7rem; padding:2px 6px; border-radius:10px; margin-left:4px;"></span></button>
    </div>

    <div id="overviewPanel"></div>
    <div id="underReviewPanel" style="display:none;"></div>
    <div id="allReportsPanel" style="display:none;"></div>
    <div id="idVerificationsPanel" style="display:none;"></div>
    <div id="featureRequestsPanel" style="display:none;"></div>
    <div id="storeRequestsPanel" style="display:none;"></div>
    <div id="listingPostsPanel" style="display:none;"></div>
  </div>
</article>

<script src="/marketplace.js"></script>
<script>
(function () {
  const gate = document.getElementById('adminGate');
  const content = document.getElementById('adminContent');
  const REASON_LABELS = {
    scam: 'Scam or suspicious',
    wrong_category: 'Wrong category',
    sold_elsewhere: 'Already sold elsewhere',
    offensive: 'Offensive content',
    other: 'Other'
  };

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      gate.innerHTML = '<div class="callout"><strong>Log in required.</strong> <a href="/account">Log in</a> with an admin account to view this page.</div>';
      return;
    }

    const { data: profile, error } = await sb.from('profiles').select('is_admin').eq('id', session.user.id).maybeSingle();
    if (error || !profile || !profile.is_admin) {
      gate.innerHTML = '<div class="callout"><strong>Not authorized.</strong> This account doesn\'t have admin access.</div>';
      return;
    }

    content.style.display = '';
    loadOverview();
    loadUnderReview();
    loadAllReports();
    loadIdVerifications();
    loadFeatureRequests();
    loadStoreRequests();
    loadListingPosts();
  }

  document.getElementById('tabOverview').addEventListener('click', function () {
    setTab('overview');
  });
  document.getElementById('tabUnderReview').addEventListener('click', function () {
    setTab('underReview');
  });
  document.getElementById('tabAllReports').addEventListener('click', function () {
    setTab('allReports');
  });
  document.getElementById('tabIdVerifications').addEventListener('click', function () {
    setTab('idVerifications');
  });
  document.getElementById('tabFeatureRequests').addEventListener('click', function () {
    setTab('featureRequests');
  });
  document.getElementById('tabStoreRequests').addEventListener('click', function () {
    setTab('storeRequests');
  });
  document.getElementById('tabListingPosts').addEventListener('click', function () {
    setTab('listingPosts');
  });
  function setTab(which) {
    document.getElementById('tabOverview').classList.toggle('active', which === 'overview');
    document.getElementById('tabUnderReview').classList.toggle('active', which === 'underReview');
    document.getElementById('tabAllReports').classList.toggle('active', which === 'allReports');
    document.getElementById('tabIdVerifications').classList.toggle('active', which === 'idVerifications');
    document.getElementById('tabFeatureRequests').classList.toggle('active', which === 'featureRequests');
    document.getElementById('tabStoreRequests').classList.toggle('active', which === 'storeRequests');
    document.getElementById('tabListingPosts').classList.toggle('active', which === 'listingPosts');
    document.getElementById('overviewPanel').style.display = which === 'overview' ? '' : 'none';
    document.getElementById('underReviewPanel').style.display = which === 'underReview' ? '' : 'none';
    document.getElementById('allReportsPanel').style.display = which === 'allReports' ? '' : 'none';
    document.getElementById('idVerificationsPanel').style.display = which === 'idVerifications' ? '' : 'none';
    document.getElementById('featureRequestsPanel').style.display = which === 'featureRequests' ? '' : 'none';
    document.getElementById('storeRequestsPanel').style.display = which === 'storeRequests' ? '' : 'none';
    document.getElementById('listingPostsPanel').style.display = which === 'listingPosts' ? '' : 'none';
  }

  async function loadUnderReview() {
    const panel = document.getElementById('underReviewPanel');
    panel.innerHTML = '<p class="lead">Loading…</p>';

    const { data: listings, error } = await sb
      .from('listings')
      .select('*')
      .eq('status', 'under_review')
      .order('created_at', { ascending: false });

    if (error) {
      panel.innerHTML = '<div class="callout">Couldn\'t load: ' + escapeHtml(error.message) + '</div>';
      return;
    }
    if (!listings.length) {
      panel.innerHTML = '<div class="callout">Nothing under review right now. 🎉</div>';
      return;
    }

    const listingIds = listings.map(function (l) { return l.id; });
    const { data: reports } = await sb
      .from('listing_reports')
      .select('*')
      .in('listing_id', listingIds)
      .order('created_at', { ascending: false });

    panel.innerHTML = listings.map(function (l) {
      const myReports = (reports || []).filter(function (r) { return r.listing_id === l.id; });
      return renderModerationCard(l, myReports);
    }).join('');

    bindModerationButtons();
  }

  async function loadAllReports() {
    const panel = document.getElementById('allReportsPanel');
    panel.innerHTML = '<p class="lead">Loading…</p>';

    const { data: reports, error } = await sb
      .from('listing_reports')
      .select('*, listings(title, status, id)')
      .order('created_at', { ascending: false })
      .limit(100);

    if (error) {
      panel.innerHTML = '<div class="callout">Couldn\'t load: ' + escapeHtml(error.message) + '</div>';
      return;
    }
    if (!reports.length) {
      panel.innerHTML = '<div class="callout">No reports yet.</div>';
      return;
    }

    panel.innerHTML = '<div class="admin-report-list">' + reports.map(function (r) {
      const listingTitle = r.listings ? escapeHtml(r.listings.title) : '(listing deleted)';
      const listingHref = r.listings ? '/listing?id=' + encodeURIComponent(r.listings.id) : null;
      return (
        '<div class="admin-report-row">' +
          '<div><strong>' + (REASON_LABELS[r.reason] || r.reason) + '</strong> — ' +
            (listingHref ? '<a href="' + listingHref + '" target="_blank">' + listingTitle + '</a>' : listingTitle) +
          '</div>' +
          (r.details ? '<p class="admin-report-details">' + escapeHtml(r.details) + '</p>' : '') +
          '<div class="admin-report-meta">' + formatDate(r.created_at) +
            (r.listings ? ' · status: ' + escapeHtml(r.listings.status) : '') +
          '</div>' +
        '</div>'
      );
    }).join('') + '</div>';
  }

  function renderModerationCard(l, reports) {
    const reasonsSummary = reports.map(function (r) {
      return REASON_LABELS[r.reason] || r.reason;
    }).join(', ');
    const detailsList = reports.filter(function (r) { return r.details; }).map(function (r) {
      return '<li>' + escapeHtml(r.details) + '</li>';
    }).join('');

    return (
      '<div class="phone admin-mod-card">' +
        '<div class="phone-head">' +
          '<div class="card-title-group">' +
            '<h2><a href="/listing?id=' + encodeURIComponent(l.id) + '" target="_blank">' + escapeHtml(l.title) + '</a></h2>' +
          '</div>' +
          '<span class="price">' + formatPrice(l.price) + '</span>' +
        '</div>' +
        '<p class="best-for">' + reports.length + ' report' + (reports.length === 1 ? '' : 's') + ' — ' + escapeHtml(reasonsSummary) + '</p>' +
        (detailsList ? '<ul class="admin-details-list">' + detailsList + '</ul>' : '') +
        '<div class="admin-mod-actions">' +
          '<button type="button" class="btn-primary" data-action="approve" data-id="' + l.id + '">Approve (restore listing)</button>' +
          '<button type="button" class="btn-secondary" data-action="remove" data-id="' + l.id + '">Remove listing</button>' +
        '</div>' +
        '<div class="form-status" id="modStatus-' + l.id + '"></div>' +
      '</div>'
    );
  }

  function bindModerationButtons() {
    document.querySelectorAll('[data-action="approve"]').forEach(function (btn) {
      btn.addEventListener('click', function () { moderate(this.dataset.id, 'active', this); });
    });
    document.querySelectorAll('[data-action="remove"]').forEach(function (btn) {
      btn.addEventListener('click', function () { moderate(this.dataset.id, 'removed', this); });
    });
  }

  async function moderate(listingId, newStatus, btn) {
    const statusEl = document.getElementById('modStatus-' + listingId);
    btn.disabled = true;
    const { error } = await sb.from('listings').update({ status: newStatus }).eq('id', listingId);
    if (error) {
      statusEl.textContent = 'Failed: ' + error.message;
      statusEl.className = 'form-status error';
      btn.disabled = false;
      return;
    }
    statusEl.textContent = newStatus === 'active' ? 'Restored.' : 'Removed.';
    statusEl.className = 'form-status success';
    setTimeout(loadUnderReview, 700);
  }

  function ocrBadgeHtml(v) {
    if (v.ocr_match === true) {
      return '<p style="margin-top:8px; font-size:0.85rem; color:var(--green); font-weight:600;">✓ Scanned text on the photo matches the ID number entered</p>';
    }
    if (v.ocr_match === false) {
      return '<p style="margin-top:8px; font-size:0.85rem; color:var(--red); font-weight:600;">⚠️ Scanned text did NOT match the ID number entered — look closely</p>' +
        (v.ocr_extracted_text ? '<p style="margin-top:2px; font-size:0.78rem; color:var(--ink-soft); font-family:monospace; word-break:break-word;">Scan found: "' + escapeHtml(v.ocr_extracted_text.slice(0, 200)) + '"</p>' : '');
    }
    return '<p style="margin-top:8px; font-size:0.85rem; color:var(--ink-soft);">Automatic scan unavailable for this one — review the photo directly.</p>';
  }

  async function loadIdVerifications() {
    const panel = document.getElementById('idVerificationsPanel');
    panel.innerHTML = '<p class="lead">Loading…</p>';

    const { data: verifications, error } = await sb
      .from('id_verifications')
      .select('*')
      .eq('status', 'pending')
      .order('submitted_at', { ascending: true });

    const badge = document.getElementById('idVerifyBadge');

    if (error) {
      panel.innerHTML = '<div class="callout">Couldn\'t load: ' + escapeHtml(error.message) + '</div>';
      return;
    }
    if (!verifications.length) {
      badge.style.display = 'none';
      panel.innerHTML = '<div class="callout">No pending ID verifications. 🎉</div>';
      return;
    }

    badge.textContent = verifications.length;
    badge.style.display = '';

    const userIds = verifications.map(function (v) { return v.user_id; });
    const { data: profiles } = await sb.from('profiles').select('id, email').in('id', userIds);
    const emailById = {};
    (profiles || []).forEach(function (p) { emailById[p.id] = p.email; });

    panel.innerHTML = verifications.map(function (v) {
      return (
        '<div class="phone admin-mod-card" data-user="' + v.user_id + '">' +
          '<div class="phone-head">' +
            '<div class="card-title-group"><h2>' + escapeHtml(emailById[v.user_id] || 'Unknown seller') + '</h2></div>' +
          '</div>' +
          '<p class="best-for">' + escapeHtml(v.id_type || 'ID') + ' — ' + escapeHtml(v.id_number || '') + '</p>' +
          '<div class="admin-report-meta">Submitted ' + formatDate(v.submitted_at) + '</div>' +
          ocrBadgeHtml(v) +
          '<button type="button" class="btn-secondary" data-action="view-id" data-path="' + escapeHtml(v.document_path) + '" style="margin-top:10px;">View ID photo</button>' +
          '<div class="admin-mod-actions" style="margin-top:12px;">' +
            '<button type="button" class="btn-primary" data-action="approve-id" data-user="' + v.user_id + '">Approve</button>' +
            '<button type="button" class="btn-secondary" data-action="reject-id" data-user="' + v.user_id + '">Reject</button>' +
          '</div>' +
          '<div class="form-status" id="idModStatus-' + v.user_id + '"></div>' +
        '</div>'
      );
    }).join('');

    bindIdVerificationButtons();
  }

  function bindIdVerificationButtons() {
    document.querySelectorAll('[data-action="view-id"]').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        btn.disabled = true;
        const originalText = btn.textContent;
        btn.textContent = 'Loading…';
        const { data, error } = await sb.storage.from('id-documents').createSignedUrl(btn.dataset.path, 300);
        btn.disabled = false;
        btn.textContent = originalText;
        if (error || !data) {
          alert("Couldn't load that photo.");
          return;
        }
        window.open(data.signedUrl, '_blank', 'noopener');
      });
    });

    document.querySelectorAll('[data-action="approve-id"]').forEach(function (btn) {
      btn.addEventListener('click', function () { reviewIdVerification(btn.dataset.user, 'approved', null, btn); });
    });

    document.querySelectorAll('[data-action="reject-id"]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const reason = prompt('Reason for rejecting (shown to the seller so they can resubmit correctly):');
        if (reason === null) return;
        reviewIdVerification(btn.dataset.user, 'rejected', reason.trim() || 'The submitted ID could not be verified.', btn);
      });
    });
  }

  async function reviewIdVerification(userId, newStatus, reviewNote, btn) {
    const statusEl = document.getElementById('idModStatus-' + userId);
    btn.disabled = true;
    const { error } = await sb.from('id_verifications').update({
      status: newStatus,
      reviewed_at: new Date().toISOString(),
      review_note: reviewNote,
    }).eq('user_id', userId);

    if (error) {
      statusEl.textContent = 'Failed: ' + error.message;
      statusEl.className = 'form-status error';
      btn.disabled = false;
      return;
    }
    statusEl.textContent = newStatus === 'approved' ? 'Approved.' : 'Rejected.';
    statusEl.className = 'form-status success';
    setTimeout(loadIdVerifications, 700);
  }

  async function loadFeatureRequests() {
    const panel = document.getElementById('featureRequestsPanel');
    panel.innerHTML = '<p class="lead">Loading…</p>';

    const { data: requests, error } = await sb
      .from('feature_requests')
      .select('id, listing_id, user_id, requested_at, listings(title, seller_name)')
      .eq('status', 'pending')
      .order('requested_at', { ascending: true });

    const badge = document.getElementById('featureReqBadge');

    if (error) {
      panel.innerHTML = '<div class="callout">Couldn\'t load: ' + escapeHtml(error.message) + '</div>';
      return;
    }
    if (!requests.length) {
      badge.style.display = 'none';
      panel.innerHTML = '<div class="callout">No pending feature requests.</div>';
      return;
    }

    badge.textContent = requests.length;
    badge.style.display = '';

    panel.innerHTML = requests.map(function (r) {
      const listing = r.listings || {};
      return (
        '<div class="phone admin-mod-card" data-request="' + r.id + '">' +
          '<div class="phone-head">' +
            '<div class="card-title-group"><h2>' + escapeHtml(listing.title || 'Listing removed') + '</h2></div>' +
          '</div>' +
          '<p class="best-for">Seller: ' + escapeHtml(listing.seller_name || 'Unknown') + '</p>' +
          '<div class="admin-report-meta">Requested ' + formatDate(r.requested_at) + '</div>' +
          '<a class="btn-secondary" href="/listing?id=' + r.listing_id + '" target="_blank" style="display:inline-block; margin-top:10px;">View listing</a>' +
          '<div class="admin-mod-actions" style="margin-top:12px;">' +
            '<button type="button" class="btn-primary" data-action="approve-feature" data-request="' + r.id + '" data-listing="' + r.listing_id + '">Confirm ₵10 received — Feature it</button>' +
            '<button type="button" class="btn-secondary" data-action="reject-feature" data-request="' + r.id + '">Reject</button>' +
          '</div>' +
          '<div class="form-status" id="featureModStatus-' + r.id + '"></div>' +
        '</div>'
      );
    }).join('');

    bindFeatureRequestButtons();
  }

  function bindFeatureRequestButtons() {
    document.querySelectorAll('[data-action="approve-feature"]').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        const requestId = btn.dataset.request;
        const listingId = btn.dataset.listing;
        const statusEl = document.getElementById('featureModStatus-' + requestId);
        btn.disabled = true;

        const featuredUntil = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString();
        const { error: listingErr } = await sb.from('listings').update({
          featured: true,
          featured_until: featuredUntil,
          feature_reminder_sent_at: null,
        }).eq('id', listingId);

        if (listingErr) {
          statusEl.textContent = 'Failed: ' + listingErr.message;
          statusEl.className = 'form-status error';
          btn.disabled = false;
          return;
        }

        const { error: reqErr } = await sb.from('feature_requests').update({
          status: 'approved',
          reviewed_at: new Date().toISOString(),
        }).eq('id', requestId);

        if (reqErr) {
          statusEl.textContent = 'Listing featured, but failed to update request: ' + reqErr.message;
          statusEl.className = 'form-status error';
          return;
        }

        statusEl.textContent = 'Featured for 7 days.';
        statusEl.className = 'form-status success';
        setTimeout(loadFeatureRequests, 700);
      });
    });

    document.querySelectorAll('[data-action="reject-feature"]').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        const requestId = btn.dataset.request;
        const reason = prompt('Reason for rejecting (e.g. "payment not received"):');
        if (reason === null) return;
        const statusEl = document.getElementById('featureModStatus-' + requestId);
        btn.disabled = true;

        const { error } = await sb.from('feature_requests').update({
          status: 'rejected',
          reviewed_at: new Date().toISOString(),
          review_note: reason.trim() || 'Payment could not be confirmed.',
        }).eq('id', requestId);

        if (error) {
          statusEl.textContent = 'Failed: ' + error.message;
          statusEl.className = 'form-status error';
          btn.disabled = false;
          return;
        }
        statusEl.textContent = 'Rejected.';
        statusEl.className = 'form-status success';
        setTimeout(loadFeatureRequests, 700);
      });
    });
  }

  async function loadStoreRequests() {
    const panel = document.getElementById('storeRequestsPanel');
    panel.innerHTML = '<p class="lead">Loading…</p>';

    const { data: requests, error } = await sb
      .from('store_subscription_requests')
      .select('id, store_id, user_id, requested_at, stores(name, expires_at)')
      .eq('status', 'pending')
      .order('requested_at', { ascending: true });

    const badge = document.getElementById('storeReqBadge');

    if (error) {
      panel.innerHTML = '<div class="callout">Couldn\'t load: ' + escapeHtml(error.message) + '</div>';
      return;
    }
    if (!requests.length) {
      badge.style.display = 'none';
      panel.innerHTML = '<div class="callout">No pending store subscription requests.</div>';
      return;
    }

    badge.textContent = requests.length;
    badge.style.display = '';

    panel.innerHTML = requests.map(function (r) {
      const store = r.stores || {};
      return (
        '<div class="phone admin-mod-card" data-request="' + r.id + '">' +
          '<div class="phone-head">' +
            '<div class="card-title-group"><h2>' + escapeHtml(store.name || 'Store removed') + '</h2></div>' +
          '</div>' +
          '<div class="admin-report-meta">Requested ' + formatDate(r.requested_at) + '</div>' +
          '<a class="btn-secondary" href="/store?id=' + r.store_id + '" target="_blank" style="display:inline-block; margin-top:10px;">View store</a>' +
          '<div class="admin-mod-actions" style="margin-top:12px;">' +
            '<button type="button" class="btn-primary" data-action="approve-store" data-request="' + r.id + '" data-store="' + r.store_id + '">Confirm ₵30 received — Activate</button>' +
            '<button type="button" class="btn-secondary" data-action="reject-store" data-request="' + r.id + '">Reject</button>' +
          '</div>' +
          '<div class="form-status" id="storeModStatus-' + r.id + '"></div>' +
        '</div>'
      );
    }).join('');

    bindStoreRequestButtons();
  }

  function bindStoreRequestButtons() {
    document.querySelectorAll('[data-action="approve-store"]').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        const requestId = btn.dataset.request;
        const storeId = btn.dataset.store;
        const statusEl = document.getElementById('storeModStatus-' + requestId);
        btn.disabled = true;

        const { data: currentStore } = await sb.from('stores').select('expires_at, active').eq('id', storeId).maybeSingle();
        const stillActive = currentStore && currentStore.active && currentStore.expires_at && new Date(currentStore.expires_at) > new Date();
        const baseDate = stillActive ? new Date(currentStore.expires_at) : new Date();
        const newExpiry = new Date(baseDate.getTime() + 30 * 24 * 60 * 60 * 1000).toISOString();

        const { error: storeErr } = await sb.from('stores').update({
          active: true,
          expires_at: newExpiry,
          reminder_sent_at: null,
        }).eq('id', storeId);

        if (storeErr) {
          statusEl.textContent = 'Failed: ' + storeErr.message;
          statusEl.className = 'form-status error';
          btn.disabled = false;
          return;
        }

        const { error: reqErr } = await sb.from('store_subscription_requests').update({
          status: 'approved',
          reviewed_at: new Date().toISOString(),
        }).eq('id', requestId);

        if (reqErr) {
          statusEl.textContent = 'Store activated, but failed to update request: ' + reqErr.message;
          statusEl.className = 'form-status error';
          return;
        }

        statusEl.textContent = 'Activated through ' + formatDate(newExpiry) + '.';
        statusEl.className = 'form-status success';
        setTimeout(loadStoreRequests, 700);
      });
    });

    document.querySelectorAll('[data-action="reject-store"]').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        const requestId = btn.dataset.request;
        const reason = prompt('Reason for rejecting (e.g. "payment not received"):');
        if (reason === null) return;
        const statusEl = document.getElementById('storeModStatus-' + requestId);
        btn.disabled = true;

        const { error } = await sb.from('store_subscription_requests').update({
          status: 'rejected',
          reviewed_at: new Date().toISOString(),
          review_note: reason.trim() || 'Payment could not be confirmed.',
        }).eq('id', requestId);

        if (error) {
          statusEl.textContent = 'Failed: ' + error.message;
          statusEl.className = 'form-status error';
          btn.disabled = false;
          return;
        }
        statusEl.textContent = 'Rejected.';
        statusEl.className = 'form-status success';
        setTimeout(loadStoreRequests, 700);
      });
    });
  }

  async function loadOverview() {
    const panel = document.getElementById('overviewPanel');
    panel.innerHTML = '<p class="lead">Loading…</p>';

    const startOfMonth = new Date();
    startOfMonth.setDate(1);
    startOfMonth.setHours(0, 0, 0, 0);
    const monthIso = startOfMonth.toISOString();

    const [
      usersRes,
      activeListingsRes,
      featureAllTimeRes,
      featureMonthRes,
      storeAllTimeRes,
      storeMonthRes,
      postAllTimeRes,
      postMonthRes,
      pendingReportsRes,
      pendingIdRes,
      pendingFeatureRes,
      pendingStoreRes,
      pendingPostRes,
    ] = await Promise.all([
      sb.from('profiles').select('id', { count: 'exact', head: true }),
      sb.from('listings').select('id', { count: 'exact', head: true }).eq('status', 'active'),
      sb.from('feature_requests').select('id', { count: 'exact', head: true }).eq('status', 'approved'),
      sb.from('feature_requests').select('id', { count: 'exact', head: true }).eq('status', 'approved').gte('reviewed_at', monthIso),
      sb.from('store_subscription_requests').select('id', { count: 'exact', head: true }).eq('status', 'approved'),
      sb.from('store_subscription_requests').select('id', { count: 'exact', head: true }).eq('status', 'approved').gte('reviewed_at', monthIso),
      sb.from('listing_post_requests').select('id', { count: 'exact', head: true }).eq('status', 'approved'),
      sb.from('listing_post_requests').select('id', { count: 'exact', head: true }).eq('status', 'approved').gte('reviewed_at', monthIso),
      sb.from('listing_reports').select('listing_id', { count: 'exact', head: true }),
      sb.from('id_verifications').select('user_id', { count: 'exact', head: true }).eq('status', 'pending'),
      sb.from('feature_requests').select('id', { count: 'exact', head: true }).eq('status', 'pending'),
      sb.from('store_subscription_requests').select('id', { count: 'exact', head: true }).eq('status', 'pending'),
      sb.from('listing_post_requests').select('id', { count: 'exact', head: true }).eq('status', 'pending'),
    ]);

    const featureAllTime = featureAllTimeRes.count || 0;
    const featureMonth = featureMonthRes.count || 0;
    const storeAllTime = storeAllTimeRes.count || 0;
    const storeMonth = storeMonthRes.count || 0;
    const postAllTime = postAllTimeRes.count || 0;
    const postMonth = postMonthRes.count || 0;

    const revenueAllTime = featureAllTime * 10 + storeAllTime * 30 + postAllTime * 5;
    const revenueMonth = featureMonth * 10 + storeMonth * 30 + postMonth * 5;

    const statCard = function (label, value, sub) {
      return (
        '<div class="phone" style="padding:18px;">' +
          '<div style="font-size:0.8rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em;">' + escapeHtml(label) + '</div>' +
          '<div style="font-size:1.8rem; font-weight:700; margin-top:4px;">' + value + '</div>' +
          (sub ? '<div style="font-size:0.82rem; color:var(--ink-soft); margin-top:4px;">' + sub + '</div>' : '') +
        '</div>'
      );
    };

    panel.innerHTML =
      '<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:14px; margin-bottom:24px;">' +
        statCard('Revenue this month', '₵' + revenueMonth, featureMonth + ' feature(s) + ' + storeMonth + ' store sub(s) + ' + postMonth + ' post fee(s)') +
        statCard('Revenue all-time', '₵' + revenueAllTime, featureAllTime + ' feature(s) + ' + storeAllTime + ' store sub(s) + ' + postAllTime + ' post fee(s)') +
        statCard('Registered users', usersRes.count || 0, null) +
        statCard('Active listings', activeListingsRes.count || 0, null) +
      '</div>' +
      '<h3 style="margin-bottom:10px;">Awaiting your review</h3>' +
      '<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:14px;">' +
        statCard('Listing reports', pendingReportsRes.count || 0, null) +
        statCard('ID verifications', pendingIdRes.count || 0, null) +
        statCard('Feature requests', pendingFeatureRes.count || 0, null) +
        statCard('Store subscriptions', pendingStoreRes.count || 0, null) +
        statCard('New listings', pendingPostRes.count || 0, null) +
      '</div>';
  }

  async function loadListingPosts() {
    const panel = document.getElementById('listingPostsPanel');
    panel.innerHTML = '<p class="lead">Loading…</p>';

    const { data: requests, error } = await sb
      .from('listing_post_requests')
      .select('id, listing_id, user_id, requested_at, listings(title, seller_name, price)')
      .eq('status', 'pending')
      .order('requested_at', { ascending: true });

    const badge = document.getElementById('listingPostBadge');

    if (error) {
      panel.innerHTML = '<div class="callout">Couldn\'t load: ' + escapeHtml(error.message) + '</div>';
      return;
    }
    if (!requests.length) {
      badge.style.display = 'none';
      panel.innerHTML = '<div class="callout">No listings awaiting the posting fee.</div>';
      return;
    }

    badge.textContent = requests.length;
    badge.style.display = '';

    panel.innerHTML = requests.map(function (r) {
      const listing = r.listings || {};
      return (
        '<div class="phone admin-mod-card" data-request="' + r.id + '">' +
          '<div class="phone-head">' +
            '<div class="card-title-group"><h2>' + escapeHtml(listing.title || 'Listing removed') + '</h2></div>' +
          '</div>' +
          '<p class="best-for">Seller: ' + escapeHtml(listing.seller_name || 'Unknown') + (listing.price ? ' &middot; ₵' + listing.price : '') + '</p>' +
          '<div class="admin-report-meta">Requested ' + formatDate(r.requested_at) + '</div>' +
          '<a class="btn-secondary" href="/listing?id=' + r.listing_id + '" target="_blank" style="display:inline-block; margin-top:10px;">Preview listing</a>' +
          '<div class="admin-mod-actions" style="margin-top:12px;">' +
            '<button type="button" class="btn-primary" data-action="approve-post" data-request="' + r.id + '" data-listing="' + r.listing_id + '">Confirm ₵5 received — Publish</button>' +
            '<button type="button" class="btn-secondary" data-action="reject-post" data-request="' + r.id + '">Reject</button>' +
          '</div>' +
          '<div class="form-status" id="postModStatus-' + r.id + '"></div>' +
        '</div>'
      );
    }).join('');

    bindListingPostButtons();
  }

  function bindListingPostButtons() {
    document.querySelectorAll('[data-action="approve-post"]').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        const requestId = btn.dataset.request;
        const listingId = btn.dataset.listing;
        const statusEl = document.getElementById('postModStatus-' + requestId);
        btn.disabled = true;

        const { error: listingErr } = await sb.from('listings').update({ status: 'active' }).eq('id', listingId);

        if (listingErr) {
          statusEl.textContent = 'Failed: ' + listingErr.message;
          statusEl.className = 'form-status error';
          btn.disabled = false;
          return;
        }

        const { error: reqErr } = await sb.from('listing_post_requests').update({
          status: 'approved',
          reviewed_at: new Date().toISOString(),
        }).eq('id', requestId);

        if (reqErr) {
          statusEl.textContent = 'Listing published, but failed to update request: ' + reqErr.message;
          statusEl.className = 'form-status error';
          return;
        }

        statusEl.textContent = 'Published.';
        statusEl.className = 'form-status success';
        setTimeout(loadListingPosts, 700);
      });
    });

    document.querySelectorAll('[data-action="reject-post"]').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        const requestId = btn.dataset.request;
        const reason = prompt('Reason for rejecting (e.g. "payment not received"):');
        if (reason === null) return;
        const statusEl = document.getElementById('postModStatus-' + requestId);
        btn.disabled = true;

        const { error } = await sb.from('listing_post_requests').update({
          status: 'rejected',
          reviewed_at: new Date().toISOString(),
          review_note: reason.trim() || 'Payment could not be confirmed.',
        }).eq('id', requestId);

        if (error) {
          statusEl.textContent = 'Failed: ' + error.message;
          statusEl.className = 'form-status error';
          btn.disabled = false;
          return;
        }
        statusEl.textContent = 'Rejected.';
        statusEl.className = 'form-status success';
        setTimeout(loadListingPosts, 700);
      });
    });
  }

  init();
})();
</script>
</body>
</html>
