<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Ghana Buys Marketplace</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Archivo:wght@700;800;900&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#00693E">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ghana Buys">
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="page-account">

<nav>
  <a class="brand" href="/"><img class="logo-mark" src="/logo-icon.png" alt="Ghana Buys">Ghana Buys</a>
  <a class="back" href="/marketplace">&larr; All listings</a>
</nav>
<div class="kente-bar"></div>

<article class="wrap">
  <span class="tag">Admin</span>
  <h1 class="title">Moderation</h1>
  <p class="lead">Listings flagged by reports, hidden pending your review.</p>

  <div id="adminGate"></div>
  <div id="adminContent" style="display:none;">
    <div class="admin-tabs">
      <button type="button" class="auth-tab active" id="tabOverview">Overview</button>
      <button type="button" class="auth-tab" id="tabUnderReview">Under review</button>
      <button type="button" class="auth-tab" id="tabAllReports">All reports</button>
      <button type="button" class="auth-tab" id="tabIdVerifications">ID verifications</button>
      <button type="button" class="auth-tab" id="tabFeatureRequests">Feature requests</button>
      <button type="button" class="auth-tab" id="tabStoreSubscriptions">Store subscriptions</button>
    </div>

    <div id="overviewPanel"></div>
    <div id="underReviewPanel" style="display:none;"></div>
    <div id="allReportsPanel" style="display:none;"></div>
    <div id="idVerificationsPanel" style="display:none;"></div>
    <div id="featureRequestsPanel" style="display:none;"></div>
    <div id="storeSubscriptionsPanel" style="display:none;"></div>
  </div>
</article>

<script src="/marketplace.js"></script>
<script>
(function () {
  const gate = document.getElementById('adminGate');
  const content = document.getElementById('adminContent');
  const REASON_LABELS = {
    scam: 'Scam or suspicious',
    wrong_category: 'Wrong category',
    sold_elsewhere: 'Already sold elsewhere',
    offensive: 'Offensive content',
    other: 'Other'
  };

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      gate.innerHTML = '<div class="callout"><strong>Log in required.</strong> <a href="/account">Log in</a> with an admin account to view this page.</div>';
      return;
    }

    const { data: profile, error } = await sb.from('profiles').select('is_admin').eq('id', session.user.id).maybeSingle();
    if (error || !profile || !profile.is_admin) {
      gate.innerHTML = '<div class="callout"><strong>Not authorized.</strong> This account doesn\'t have admin access.</div>';
      return;
    }

    content.style.display = '';
    loadOverview();
    loadUnderReview();
    loadAllReports();
    loadIdVerifications();
    loadFeatureRequests();
    loadStoreSubscriptions();
  }

  document.getElementById('tabOverview').addEventListener('click', function () {
    setTab('overview');
  });
  document.getElementById('tabUnderReview').addEventListener('click', function () {
    setTab('underReview');
  });
  document.getElementById('tabAllReports').addEventListener('click', function () {
    setTab('allReports');
  });
  document.getElementById('tabIdVerifications').addEventListener('click', function () {
    setTab('idVerifications');
  });
  document.getElementById('tabFeatureRequests').addEventListener('click', function () {
    setTab('featureRequests');
  });
  document.getElementById('tabStoreSubscriptions').addEventListener('click', function () {
    setTab('storeSubscriptions');
  });
  function setTab(which) {
    ['Overview', 'UnderReview', 'AllReports', 'IdVerifications', 'FeatureRequests', 'StoreSubscriptions'].forEach(function (name) {
      const key = name.charAt(0).toLowerCase() + name.slice(1);
      document.getElementById('tab' + name).classList.toggle('active', key === which);
      document.getElementById(key + 'Panel').style.display = key === which ? '' : 'none';
    });
  }

  async function loadOverview() {
    const panel = document.getElementById('overviewPanel');
    panel.innerHTML = '<p class="lead">Loading…</p>';

    const monthStart = new Date();
    monthStart.setDate(1);
    monthStart.setHours(0, 0, 0, 0);

    const [
      featurePaymentsAll, storePaymentsAll,
      activeListingsCount, usersCount,
      reportsCount, pendingIdCount, pendingFeatureCount, pendingStoreSubCount
    ] = await Promise.all([
      sb.from('feature_payments').select('amount_pesewas, created_at').eq('status', 'success'),
      sb.from('store_payments').select('amount_pesewas, created_at').eq('status', 'success'),
      sb.from('listings').select('id', { count: 'exact', head: true }).eq('status', 'active'),
      sb.from('profiles').select('id', { count: 'exact', head: true }),
      sb.from('listing_reports').select('id', { count: 'exact', head: true }),
      sb.from('id_verifications').select('user_id', { count: 'exact', head: true }).eq('status', 'pending'),
      sb.from('feature_requests').select('id', { count: 'exact', head: true }).eq('status', 'pending'),
      sb.from('store_subscription_requests').select('id', { count: 'exact', head: true }).eq('status', 'pending')
    ]);

    function sumSince(rows, since) {
      return (rows || [])
        .filter(function (r) { return !since || new Date(r.created_at) >= since; })
        .reduce(function (sum, r) { return sum + (r.amount_pesewas || 0); }, 0);
    }
    function countSince(rows, since) {
      return (rows || []).filter(function (r) { return !since || new Date(r.created_at) >= since; }).length;
    }

    const featureRows = featurePaymentsAll.data || [];
    const storeRows = storePaymentsAll.data || [];

    const monthPesewas = sumSince(featureRows, monthStart) + sumSince(storeRows, monthStart);
    const allTimePesewas = sumSince(featureRows, null) + sumSince(storeRows, null);
    const monthFeatureCount = countSince(featureRows, monthStart);
    const monthStoreCount = countSince(storeRows, monthStart);
    const allFeatureCount = featureRows.length;
    const allStoreCount = storeRows.length;

    function statCard(label, value, sub) {
      return (
        '<div class="phone admin-stat-card">' +
          '<p class="best-for">' + label.toUpperCase() + '</p>' +
          '<div class="admin-stat-value">' + value + '</div>' +
          (sub ? '<p class="admin-stat-sub">' + sub + '</p>' : '') +
        '</div>'
      );
    }

    panel.innerHTML =
      '<div class="admin-stat-grid">' +
        statCard('Revenue this month', formatPrice(monthPesewas / 100), monthFeatureCount + ' feature(s) + ' + monthStoreCount + ' store sub(s)') +
        statCard('Revenue all-time', formatPrice(allTimePesewas / 100), allFeatureCount + ' feature(s) + ' + allStoreCount + ' store sub(s)') +
        statCard('Active listings', activeListingsCount.count || 0) +
        statCard('Registered users', usersCount.count || 0) +
      '</div>' +
      '<h2 style="margin-top:28px;">Awaiting your review</h2>' +
      '<div class="admin-stat-grid">' +
        statCard('Listing reports', reportsCount.count || 0) +
        statCard('ID verifications', pendingIdCount.count || 0) +
        statCard('Feature requests', pendingFeatureCount.count || 0) +
        statCard('Store subscriptions', pendingStoreSubCount.count || 0) +
      '</div>';
  }

  async function loadUnderReview() {
    const panel = document.getElementById('underReviewPanel');
    panel.innerHTML = '<p class="lead">Loading…</p>';

    const { data: listings, error } = await sb
      .from('listings')
      .select('*')
      .eq('status', 'under_review')
      .order('created_at', { ascending: false });

    if (error) {
      panel.innerHTML = '<div class="callout">Couldn\'t load: ' + escapeHtml(error.message) + '</div>';
      return;
    }
    if (!listings.length) {
      panel.innerHTML = '<div class="callout">Nothing under review right now. 🎉</div>';
      return;
    }

    const listingIds = listings.map(function (l) { return l.id; });
    const { data: reports } = await sb
      .from('listing_reports')
      .select('*')
      .in('listing_id', listingIds)
      .order('created_at', { ascending: false });

    panel.innerHTML = listings.map(function (l) {
      const myReports = (reports || []).filter(function (r) { return r.listing_id === l.id; });
      return renderModerationCard(l, myReports);
    }).join('');

    bindModerationButtons();
  }

  async function loadAllReports() {
    const panel = document.getElementById('allReportsPanel');
    panel.innerHTML = '<p class="lead">Loading…</p>';

    const { data: reports, error } = await sb
      .from('listing_reports')
      .select('*, listings(title, status, id)')
      .order('created_at', { ascending: false })
      .limit(100);

    if (error) {
      panel.innerHTML = '<div class="callout">Couldn\'t load: ' + escapeHtml(error.message) + '</div>';
      return;
    }
    if (!reports.length) {
      panel.innerHTML = '<div class="callout">No reports yet.</div>';
      return;
    }

    panel.innerHTML = '<div class="admin-report-list">' + reports.map(function (r) {
      const listingTitle = r.listings ? escapeHtml(r.listings.title) : '(listing deleted)';
      const listingHref = r.listings ? '/listing?id=' + encodeURIComponent(r.listings.id) : null;
      return (
        '<div class="admin-report-row">' +
          '<div><strong>' + (REASON_LABELS[r.reason] || r.reason) + '</strong> — ' +
            (listingHref ? '<a href="' + listingHref + '" target="_blank">' + listingTitle + '</a>' : listingTitle) +
          '</div>' +
          (r.details ? '<p class="admin-report-details">' + escapeHtml(r.details) + '</p>' : '') +
          '<div class="admin-report-meta">' + formatDate(r.created_at) +
            (r.listings ? ' · status: ' + escapeHtml(r.listings.status) : '') +
          '</div>' +
        '</div>'
      );
    }).join('') + '</div>';
  }

  function renderModerationCard(l, reports) {
    const reasonsSummary = reports.map(function (r) {
      return REASON_LABELS[r.reason] || r.reason;
    }).join(', ');
    const detailsList = reports.filter(function (r) { return r.details; }).map(function (r) {
      return '<li>' + escapeHtml(r.details) + '</li>';
    }).join('');

    return (
      '<div class="phone admin-mod-card">' +
        '<div class="phone-head">' +
          '<div class="card-title-group">' +
            '<h2><a href="/listing?id=' + encodeURIComponent(l.id) + '" target="_blank">' + escapeHtml(l.title) + '</a></h2>' +
          '</div>' +
          '<span class="price">' + formatPrice(l.price) + '</span>' +
        '</div>' +
        '<p class="best-for">' + reports.length + ' report' + (reports.length === 1 ? '' : 's') + ' — ' + escapeHtml(reasonsSummary) + '</p>' +
        (detailsList ? '<ul class="admin-details-list">' + detailsList + '</ul>' : '') +
        '<div class="admin-mod-actions">' +
          '<button type="button" class="btn-primary" data-action="approve" data-id="' + l.id + '">Approve (restore listing)</button>' +
          '<button type="button" class="btn-secondary" data-action="remove" data-id="' + l.id + '">Remove listing</button>' +
        '</div>' +
        '<div class="form-status" id="modStatus-' + l.id + '"></div>' +
      '</div>'
    );
  }

  function bindModerationButtons() {
    document.querySelectorAll('[data-action="approve"]').forEach(function (btn) {
      btn.addEventListener('click', function () { moderate(this.dataset.id, 'active', this); });
    });
    document.querySelectorAll('[data-action="remove"]').forEach(function (btn) {
      btn.addEventListener('click', function () { moderate(this.dataset.id, 'removed', this); });
    });
  }

  async function moderate(listingId, newStatus, btn) {
    const statusEl = document.getElementById('modStatus-' + listingId);
    btn.disabled = true;
    const { error } = await sb.from('listings').update({ status: newStatus }).eq('id', listingId);
    if (error) {
      statusEl.textContent = 'Failed: ' + error.message;
      statusEl.className = 'form-status error';
      btn.disabled = false;
      return;
    }
    statusEl.textContent = newStatus === 'active' ? 'Restored.' : 'Removed.';
    statusEl.className = 'form-status success';
    setTimeout(function () { loadUnderReview(); loadOverview(); }, 700);
  }

  async function loadIdVerifications() {
    const panel = document.getElementById('idVerificationsPanel');
    panel.innerHTML = '<p class="lead">Loading…</p>';

    const { data: verifications, error } = await sb
      .from('id_verifications')
      .select('*, profiles(email)')
      .eq('status', 'pending')
      .order('submitted_at', { ascending: true });

    if (error) {
      panel.innerHTML = '<div class="callout">Couldn\'t load: ' + escapeHtml(error.message) + '</div>';
      return;
    }
    if (!verifications.length) {
      panel.innerHTML = '<div class="callout">No pending ID verifications. 🎉</div>';
      return;
    }

    const cards = await Promise.all(verifications.map(async function (v) {
      let docLink = '';
      if (v.document_path) {
        const { data: signed } = await sb.storage.from('id-documents').createSignedUrl(v.document_path, 600);
        if (signed && signed.signedUrl) {
          docLink = '<a href="' + signed.signedUrl + '" target="_blank" rel="noopener">View submitted document →</a>';
        }
      }
      const email = v.profiles ? escapeHtml(v.profiles.email || '') : '';
      const ocrNote = v.ocr_extracted_text
        ? '<p class="admin-report-details">OCR read: ' + escapeHtml(v.ocr_extracted_text) +
          (v.ocr_match === true ? ' — <strong style="color:green;">matches name on file</strong>' : v.ocr_match === false ? ' — <strong style="color:#b00;">does not match name on file</strong>' : '') +
          '</p>'
        : '';

      return (
        '<div class="phone admin-mod-card">' +
          '<div class="phone-head">' +
            '<div class="card-title-group"><h2>' + email + '</h2></div>' +
          '</div>' +
          '<p class="best-for">' + escapeHtml(v.id_type || 'ID') + (v.id_number ? ' — ' + escapeHtml(v.id_number) : '') + '</p>' +
          (docLink ? '<p>' + docLink + '</p>' : '') +
          ocrNote +
          '<p class="admin-report-meta">Submitted ' + (v.submitted_at ? formatDate(v.submitted_at) : '—') + '</p>' +
          '<div class="admin-mod-actions">' +
            '<button type="button" class="btn-primary" data-action="approveId" data-id="' + v.user_id + '">Approve</button>' +
            '<button type="button" class="btn-secondary" data-action="rejectId" data-id="' + v.user_id + '">Reject</button>' +
          '</div>' +
          '<div class="form-status" id="idReqStatus-' + v.user_id + '"></div>' +
        '</div>'
      );
    }));

    panel.innerHTML = cards.join('');

    document.querySelectorAll('[data-action="approveId"]').forEach(function (btn) {
      btn.addEventListener('click', function () { reviewIdVerification(this.dataset.id, 'approved', this); });
    });
    document.querySelectorAll('[data-action="rejectId"]').forEach(function (btn) {
      btn.addEventListener('click', function () { reviewIdVerification(this.dataset.id, 'rejected', this); });
    });
  }

  async function reviewIdVerification(userId, newStatus, btn) {
    const statusEl = document.getElementById('idReqStatus-' + userId);
    btn.disabled = true;
    const { error } = await sb
      .from('id_verifications')
      .update({ status: newStatus, reviewed_at: new Date().toISOString() })
      .eq('user_id', userId);
    if (error) {
      statusEl.textContent = 'Failed: ' + error.message;
      statusEl.className = 'form-status error';
      btn.disabled = false;
      return;
    }
    statusEl.textContent = newStatus === 'approved' ? 'Approved.' : 'Rejected.';
    statusEl.className = 'form-status success';
    setTimeout(function () { loadIdVerifications(); loadOverview(); }, 700);
  }

  async function loadFeatureRequests() {
    const panel = document.getElementById('featureRequestsPanel');
    panel.innerHTML = '<p class="lead">Loading…</p>';

    const { data: requests, error } = await sb
      .from('feature_requests')
      .select('*, listings(id, title, price, user_id)')
      .eq('status', 'pending')
      .order('requested_at', { ascending: true });

    if (error) {
      panel.innerHTML = '<div class="callout">Couldn\'t load: ' + escapeHtml(error.message) + '</div>';
      return;
    }
    if (!requests.length) {
      panel.innerHTML = '<div class="callout">No pending feature requests. 🎉</div>';
      return;
    }

    panel.innerHTML = requests.map(function (r) {
      const listingTitle = r.listings ? escapeHtml(r.listings.title) : '(listing deleted)';
      const listingHref = r.listings ? '/listing?id=' + encodeURIComponent(r.listings.id) : null;
      return (
        '<div class="phone admin-mod-card">' +
          '<div class="phone-head">' +
            '<div class="card-title-group">' +
              '<h2>' + (listingHref ? '<a href="' + listingHref + '" target="_blank">' + listingTitle + '</a>' : listingTitle) + '</h2>' +
            '</div>' +
            (r.listings ? '<span class="price">' + formatPrice(r.listings.price) + '</span>' : '') +
          '</div>' +
          '<p class="best-for">Requested ' + formatDate(r.requested_at) + ' — confirm the ₵10 Mobile Money payment landed before approving.</p>' +
          '<div class="admin-mod-actions">' +
            '<button type="button" class="btn-primary" data-action="approveFeature" data-id="' + r.id + '" data-listing-id="' + (r.listings ? r.listings.id : '') + '">Approve — feature for 7 days</button>' +
            '<button type="button" class="btn-secondary" data-action="rejectFeature" data-id="' + r.id + '">Reject</button>' +
          '</div>' +
          '<div class="form-status" id="featureReqStatus-' + r.id + '"></div>' +
        '</div>'
      );
    }).join('');

    document.querySelectorAll('[data-action="approveFeature"]').forEach(function (btn) {
      btn.addEventListener('click', function () { approveFeatureRequest(this.dataset.id, this.dataset.listingId, this); });
    });
    document.querySelectorAll('[data-action="rejectFeature"]').forEach(function (btn) {
      btn.addEventListener('click', function () { rejectFeatureRequest(this.dataset.id, this); });
    });
  }

  async function approveFeatureRequest(requestId, listingId, btn) {
    const statusEl = document.getElementById('featureReqStatus-' + requestId);
    btn.disabled = true;

    const featuredUntil = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString();

    const { error: listingError } = await sb
      .from('listings')
      .update({ featured: true, featured_until: featuredUntil })
      .eq('id', listingId);

    if (listingError) {
      statusEl.textContent = 'Failed: ' + listingError.message;
      statusEl.className = 'form-status error';
      btn.disabled = false;
      return;
    }

    const { error: reqError } = await sb
      .from('feature_requests')
      .update({ status: 'approved', reviewed_at: new Date().toISOString() })
      .eq('id', requestId);

    if (reqError) {
      statusEl.textContent = 'Listing featured, but failed to update request: ' + reqError.message;
      statusEl.className = 'form-status error';
      return;
    }

    statusEl.textContent = 'Approved — listing is now featured for 7 days.';
    statusEl.className = 'form-status success';
    setTimeout(function () { loadFeatureRequests(); loadOverview(); }, 700);
  }

  async function rejectFeatureRequest(requestId, btn) {
    const statusEl = document.getElementById('featureReqStatus-' + requestId);
    btn.disabled = true;
    const { error } = await sb
      .from('feature_requests')
      .update({ status: 'rejected', reviewed_at: new Date().toISOString() })
      .eq('id', requestId);
    if (error) {
      statusEl.textContent = 'Failed: ' + error.message;
      statusEl.className = 'form-status error';
      btn.disabled = false;
      return;
    }
    statusEl.textContent = 'Rejected.';
    statusEl.className = 'form-status success';
    setTimeout(function () { loadFeatureRequests(); loadOverview(); }, 700);
  }

  async function loadStoreSubscriptions() {
    const panel = document.getElementById('storeSubscriptionsPanel');
    panel.innerHTML = '<p class="lead">Loading…</p>';

    const { data: requests, error } = await sb
      .from('store_subscription_requests')
      .select('*, stores(id, name, user_id, expires_at)')
      .eq('status', 'pending')
      .order('requested_at', { ascending: true });

    if (error) {
      panel.innerHTML = '<div class="callout">Couldn\'t load: ' + escapeHtml(error.message) + '</div>';
      return;
    }
    if (!requests.length) {
      panel.innerHTML = '<div class="callout">No pending store subscription requests. 🎉</div>';
      return;
    }

    panel.innerHTML = requests.map(function (r) {
      const storeName = r.stores ? escapeHtml(r.stores.name) : '(store deleted)';
      const storeHref = r.stores ? '/store?id=' + encodeURIComponent(r.stores.id) : null;
      return (
        '<div class="phone admin-mod-card">' +
          '<div class="phone-head">' +
            '<div class="card-title-group">' +
              '<h2>' + (storeHref ? '<a href="' + storeHref + '" target="_blank">' + storeName + '</a>' : storeName) + '</h2>' +
            '</div>' +
          '</div>' +
          '<p class="best-for">Requested ' + formatDate(r.requested_at) + ' — confirm the ₵30 Mobile Money payment landed before approving.</p>' +
          '<div class="admin-mod-actions">' +
            '<button type="button" class="btn-primary" data-action="approveStoreSub" data-id="' + r.id + '" data-store-id="' + (r.stores ? r.stores.id : '') + '" data-current-expiry="' + (r.stores && r.stores.expires_at ? r.stores.expires_at : '') + '">Approve — activate for 30 days</button>' +
            '<button type="button" class="btn-secondary" data-action="rejectStoreSub" data-id="' + r.id + '">Reject</button>' +
          '</div>' +
          '<div class="form-status" id="storeSubStatus-' + r.id + '"></div>' +
        '</div>'
      );
    }).join('');

    document.querySelectorAll('[data-action="approveStoreSub"]').forEach(function (btn) {
      btn.addEventListener('click', function () { approveStoreSubRequest(this.dataset.id, this.dataset.storeId, this.dataset.currentExpiry, this); });
    });
    document.querySelectorAll('[data-action="rejectStoreSub"]').forEach(function (btn) {
      btn.addEventListener('click', function () { rejectStoreSubRequest(this.dataset.id, this); });
    });
  }

  async function approveStoreSubRequest(requestId, storeId, currentExpiry, btn) {
    const statusEl = document.getElementById('storeSubStatus-' + requestId);
    btn.disabled = true;

    const now = Date.now();
    const currentExpiryMs = currentExpiry ? new Date(currentExpiry).getTime() : 0;
    const baseMs = currentExpiryMs > now ? currentExpiryMs : now;
    const expiresAt = new Date(baseMs + 30 * 24 * 60 * 60 * 1000).toISOString();

    const { error: storeError } = await sb
      .from('stores')
      .update({ active: true, expires_at: expiresAt })
      .eq('id', storeId);

    if (storeError) {
      statusEl.textContent = 'Failed: ' + storeError.message;
      statusEl.className = 'form-status error';
      btn.disabled = false;
      return;
    }

    const { error: reqError } = await sb
      .from('store_subscription_requests')
      .update({ status: 'approved', reviewed_at: new Date().toISOString() })
      .eq('id', requestId);

    if (reqError) {
      statusEl.textContent = 'Store activated, but failed to update request: ' + reqError.message;
      statusEl.className = 'form-status error';
      return;
    }

    statusEl.textContent = 'Approved — store subscription active for 30 days.';
    statusEl.className = 'form-status success';
    setTimeout(function () { loadStoreSubscriptions(); loadOverview(); }, 700);
  }

  async function rejectStoreSubRequest(requestId, btn) {
    const statusEl = document.getElementById('storeSubStatus-' + requestId);
    btn.disabled = true;
    const { error } = await sb
      .from('store_subscription_requests')
      .update({ status: 'rejected', reviewed_at: new Date().toISOString() })
      .eq('id', requestId);
    if (error) {
      statusEl.textContent = 'Failed: ' + error.message;
      statusEl.className = 'form-status error';
      btn.disabled = false;
      return;
    }
    statusEl.textContent = 'Rejected.';
    statusEl.className = 'form-status success';
    setTimeout(function () { loadStoreSubscriptions(); loadOverview(); }, 700);
  }

  init();
})();
</script>
</body>
</html>
